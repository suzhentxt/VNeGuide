services:
  - type: web
    name: vneguide-api
    runtime: docker
    plan: free
    region: singapore
    branch: experiment/chat-core-v2
    dockerfilePath: ./deployment/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    renderSubdomainPolicy: enabled
    envVars:
      - key: PORT
        value: "8000"
      - key: VNEGUIDE_API_HOST
        value: 0.0.0.0
      - key: VNEGUIDE_API_PORT
        value: "8000"
      - key: VNEGUIDE_LLM_PROVIDER
        value: openai
      - key: VNEGUIDE_MODEL
        value: gpt-4o-mini
      - key: VNEGUIDE_API_KEY
        sync: false
      - key: VNEGUIDE_SESSION_TTL_SECONDS
        value: "1800"
      - key: VNEGUIDE_SESSION_MAX_ACTIVE
        value: "100"

previews:
  generation: off
