name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[api,dev,ocr]"
      - run: python -m ruff check src tests deployment
      - run: python -m ruff format --check src tests deployment
      - run: python -m mypy
      - run: python -m pytest --cov=vneguide --cov-report=term-missing
      - run: python deployment/scripts/release_audit.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demoweb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demoweb/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[api]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demoweb/package-lock.json
      - run: npm ci
        working-directory: demoweb
      - run: npx playwright install --with-deps chromium
        working-directory: demoweb
      - run: npm run test:e2e
        working-directory: demoweb
        env:
          VNEGUIDE_E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: |
            demoweb/playwright-report
            demoweb/test-results
          if-no-files-found: ignore
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    needs: [python, web, e2e]
    env:
      VNEGUIDE_LLM_PROVIDER: mock
      VNEGUIDE_MODEL: mock-scripted
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deployment/docker-compose.yml config --quiet
      - run: docker compose -f deployment/docker-compose.yml up --build --detach --wait --wait-timeout 180
      - run: >-
          python3 deployment/scripts/smoke.py
          --api-url http://127.0.0.1:8080
          --web-url http://127.0.0.1:8080
          --samples 3
          --provider mock
          --model mock-scripted
      - if: always()
        run: docker compose -f deployment/docker-compose.yml down --volumes
