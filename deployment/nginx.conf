events {}

http {
    server_tokens off;
    # Status checks (GET) do not consume the upload budget; only audio POSTs are keyed.
    map $request_method $stt_client_key {
        default "";
        POST $binary_remote_addr;
    }
    map $request_method $tts_client_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $stt_client_key zone=stt_per_ip:10m rate=5r/m;
    limit_conn_zone $stt_client_key zone=stt_conn_per_ip:10m;
    limit_req_zone $tts_client_key zone=tts_per_ip:10m rate=10r/m;
    limit_conn_zone $tts_client_key zone=tts_conn_per_ip:10m;

    server {
        listen 8080;
        client_max_body_size 1m;

        location = /health {
            proxy_pass http://api:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/stt/transcribe {
            client_max_body_size 10m;
            client_body_timeout 30s;
            limit_req zone=stt_per_ip burst=2 nodelay;
            limit_req_status 429;
            limit_conn stt_conn_per_ip 1;
            limit_conn_status 429;

            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 195s;
            # Stream audio to the bounded BFF reader instead of persisting request bodies on disk.
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/tts/speech {
            client_max_body_size 8k;
            client_body_timeout 10s;
            limit_req zone=tts_per_ip burst=3 nodelay;
            limit_req_status 429;
            limit_conn tts_conn_per_ip 1;
            limit_conn_status 429;

            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 130s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web:3000;
            # Port 9000 is an HTTP-only controlled preview; preserve the current cookie override.
            proxy_cookie_flags vneguide_chat_session nosecure;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
