name: vneguide

services:
  api:
    build:
      context: ..
      dockerfile: deployment/api.Dockerfile
    environment:
      VNEGUIDE_API_HOST: 0.0.0.0
      VNEGUIDE_API_PORT: 8000
      VNEGUIDE_LLM_PROVIDER: ${VNEGUIDE_LLM_PROVIDER:-mock}
      VNEGUIDE_MODEL: ${VNEGUIDE_MODEL:-}
      VNEGUIDE_API_KEY: ${VNEGUIDE_API_KEY:-}
      VNEGUIDE_LITELLM_API_KEY: ${VNEGUIDE_LITELLM_API_KEY:-}
      VNEGUIDE_LITELLM_BASE_URL: ${VNEGUIDE_LITELLM_BASE_URL:-}
      VNEGUIDE_LITELLM_ALLOW_INSECURE_HTTP: ${VNEGUIDE_LITELLM_ALLOW_INSECURE_HTTP:-0}
      VNEGUIDE_LITELLM_DISABLE_THINKING: ${VNEGUIDE_LITELLM_DISABLE_THINKING:-1}
      VNEGUIDE_SESSION_TTL_SECONDS: ${VNEGUIDE_SESSION_TTL_SECONDS:-1800}
      VNEGUIDE_SESSION_MAX_ACTIVE: ${VNEGUIDE_SESSION_MAX_ACTIVE:-100}
    ports:
      - "127.0.0.1:${VNEGUIDE_API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deployment/web.Dockerfile
    environment:
      VNEGUIDE_API_BASE_URL: http://api:8000
      VNEGUIDE_STT_ENABLED: ${VNEGUIDE_STT_ENABLED:-0}
      VNEGUIDE_STT_BASE_URL: ${VNEGUIDE_STT_BASE_URL:-}
      VNEGUIDE_STT_MODEL: ${VNEGUIDE_STT_MODEL:-Qwen/Qwen3-ASR-1.7B}
      VNEGUIDE_STT_LANGUAGE: ${VNEGUIDE_STT_LANGUAGE:-}
      VNEGUIDE_STT_PROMPT: ${VNEGUIDE_STT_PROMPT:-}
      VNEGUIDE_STT_API_KEY_FILE: ${VNEGUIDE_STT_API_KEY_FILE:-}
      VNEGUIDE_STT_ALLOW_INSECURE_HTTP: ${VNEGUIDE_STT_ALLOW_INSECURE_HTTP:-0}
      VNEGUIDE_STT_TIMEOUT_SECONDS: ${VNEGUIDE_STT_TIMEOUT_SECONDS:-180}
      VNEGUIDE_STT_MAX_BYTES: ${VNEGUIDE_STT_MAX_BYTES:-10485760}
      VNEGUIDE_STT_MAX_DURATION_SECONDS: ${VNEGUIDE_STT_MAX_DURATION_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VNEGUIDE_WEB_PORT:-3000}:3000"
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VNEGUIDE_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
