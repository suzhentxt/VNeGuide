[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vneguide"
version = "0.1.0"
description = "VNeGuide terminal chatbot MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
ocr = [
    "Pillow>=11,<13",
    "pypdfium2>=5,<6",
]
agent = [
    "langchain>=1.1,<2",
    "langchain-core>=1.2,<2",
    "langgraph>=0.2,<2",
    "langchain-openai>=1.0,<2",
    "deepagents>=0.6,<1",
]
memory = [
    "mem0ai>=2,<3",
    # NumPy 2.5 stubs use syntax incompatible with this project's Python 3.11 gate.
    "numpy>=1.26,<2.5",
]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.10,<3",
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]

[project.scripts]
vneguide = "vneguide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "live: calls a real model provider and is disabled by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[tool.coverage.run]
branch = true
source = ["vneguide"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
